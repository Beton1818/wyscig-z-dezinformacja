<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyścig z Dezinformacją</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="kontener-aplikacji">
    <header>
      <h1 class="naglowek-tytul">Wyścig z Dezinformacją</h1>
      <p class="naglowek-opis">Dzień 1 z 10 | Powstrzymaj Dezinformację</p>
      <div id="licznik-czasu" class="timer-wyswietlacz">Czas: 30s</div>
    </header>

    <section class="siatka-statystyk">
      <div class="karta-statystyki">
        <div class="etykieta-statystyki">
          <span>Prawda w sieci</span>
          <span id="etykieta-prawdy">50%</span>
        </div>
        <div class="pasek-postepu">
          <div class="wypelnienie-postepu wypelnienie-prawdy"></div>
        </div>
      </div>

      <div class="karta-statystyki">
        <div class="etykieta-statystyki">
          <span>Zaufanie</span>
          <span id="etykieta-zaufania">50%</span>
        </div>
        <div class="pasek-postepu">
          <div class="wypelnienie-postepu wypelnienie-zaufania"></div>
        </div>
      </div>
    </section>

    <article class="karta-posta">
      <div class="informacje-o-autorze">
        <div class="awatar" id="post-awatar">P</div>
        <div class="szczegoly-autora">
          <div class="nazwa" id="post-autor">Nazwa Użytkownika</div>
          <div class="identyfikator" id="post-handle">@nazwa_uzytkownika</div>
        </div>
      </div>

      <div class="tresc-posta" id="post-tekst">Ładowanie posta...</div>

      <img src="" class="obrazek-posta" id="post-obrazek" alt="Grafika posta">

      <div class="wskazowka-zrodla" id="post-zrodlo">
        🔍 <strong>Źródło:</strong> <span id="tekst-zrodla">Brak danych</span>
      </div>
    </article>

    <footer class="akcje">
      <button class="przycisk przycisk-sprawdz">🔍 Sprawdź źródło</button>
      <div class="glowne-przyciski">
        <button class="przycisk przycisk-odrzuc">✖ Dezinformacja</button>
        <button class="przycisk przycisk-udostepnij">✔ Prawdziwa informacja</button>
      </div>
    </footer>

    <div class="okno-modalne" id="ekran-koncowy">
      <h2 class="tytul-modalny">Koniec Gry</h2>
      <p class="opis-modalny" id="opis-wyniku">Opis wyniku...</p>
      <div id="zapis-wyniku-sekcja" class="sekcja-zapisu" style="display: none;">
        <input type="text" id="gracz-imie" placeholder="Wpisz swój nick..." maxlength="15">
        <button id="zapisz-wynik-btn">Zapisz</button>
      </div>

      <div class="ranking-kontener">
        <h3 class="ranking-tytul">🏆 TOP 5 OBROŃCÓW PRAWDY</h3>
        <ol id="ranking-lista">
          <li class="ranking-status">Ładowanie rankingu...</li>
        </ol>

        <button id="wyczysc-ranking-btn" class="przycisk przycisk-odrzuc" style="margin-top: 12px; width: 100%;">
          🗑 Wyczyść ranking
        </button>
      </div>
      <button class="przycisk przycisk-udostepnij" id="przycisk-restart">🔄 Zagraj ponownie</button>
    </div>

  </div>

  <script>
    const bazaPostów = [
      {
        autor: "EkoWojownik",
        handle: "@eco_warrior",
        awatar: "E",
        tekst: "PILNE! Od jutra woda w kranach w całym kraju będzie zakręcana po godzinie 20:00!",
        obrazek: "kran1.jpg",
        czyPrawda: false,
        zrodlo: "Użytkownik posiada 11 obserwujących i wiele clickbaitowych postów."
      },
      {
        autor: "Centrum Zdrowia",
        handle: "@zdrowie_info",
        awatar: "Z",
        tekst: "Główny Inspektorat Sanitarny ostrzega przed partią skażonych truskawek w sklepach.",
        obrazek: "truskawki2.jpg",
        czyPrawda: true,
        zrodlo: "Użytkownik z weryfikacją i dużą liczbą obserwujących."
      },
      {
        autor: "Nauka i Cywilizacja",
        handle: "@nauka_cyw",
        awatar: "N",
        tekst: "Łazik NASA odkrył na Marsie struktury przypominające ziemskie piramidy!",
        obrazek: "mars3.jpg",
        czyPrawda: false,
        zrodlo: "Zdjęcie wygenerowane przez AI."
      },
      {
        autor: "TechInnowacje",
        handle: "@tech_nowosci",
        awatar: "T",
        tekst: "Przełom! Polscy inżynierowie wydrukowali pierwsze sztuczne serce na drukarce 3D.",
        obrazek: "serce4.jpg",
        czyPrawda: true,
        zrodlo: "Jeden z największych profilów technologicznych w Polsce."
      },
      {
        autor: "SzybkiNews",
        handle: "@szybki_news",
        awatar: "S",
        tekst: "Unia Europejska wprowadza nowy podatek od posiadania telefonów starszych niż 3 lata.",
        obrazek: "tele5.jpg",
        czyPrawda: false,
        zrodlo: "To konto wstawia średnio 90 postów dziennie."
      },
      {
        autor: "Alert RCB",
        handle: "@alert_rcb",
        awatar: "A",
        tekst: "Dzisiaj w województwie podkarpackim burze i grad.",
        obrazek: "rcb6.jpg",
        czyPrawda: true,
        zrodlo: "Oficjalne konto Alertu RCB."
      },
      {
        autor: "CryptoGuró",
        handle: "@crypto_guró",
        awatar: "C",
        tekst: "Rząd potajemnie planuje zablokować wszystkie bankomaty w najbliższy piątek!",
        obrazek: "bank7.jpg",
        czyPrawda: false,
        zrodlo: "Nazwa konta bardzo podobna do innego, znanego użytkownika."
      },
      {
        autor: "Kultura i Historia",
        handle: "@historia_pl",
        awatar: "K",
        tekst: "Podczas remontu starej kamienicy w Krakowie odkryto nieznany obraz Matejki.",
        obrazek: "matejka8.jpg",
        czyPrawda: true,
        zrodlo: "Podobne informacje widnieją na oficjalnej stronie miasta Kraków."
      },
      {
        autor: "ZdrowyStyl",
        handle: "@fit_porady",
        awatar: "Z",
        tekst: "Jedzenie łyżeczki cynamonu rano całkowicie uodparnia organizm na grypę.",
        obrazek: "cynamon9.jpg",
        czyPrawda: false,
        zrodlo: "W poście nie ma informacji na temat konkretnych badań."
      },
      {
        autor: "MiastoInfo",
        handle: "@miasto_dzis",
        awatar: "M",
        tekst: "Od przyszłego miesiąca komunikacja miejska będzie darmowa dla studentów.",
        obrazek: "podpis10.jpg",
        czyPrawda: true,
        zrodlo: "Zdjęcie przedstawia moment podpisania projektu przez burmistrza."
      }
    ];

    let aktualnyPostIndex = 0;
    let czasNaPost = 30;
    let timerInterval = null;
    let statystykaPrawdy = 50;
    let statystykaZaufania = 50;
    let ostatniWynik = 0;
    let graZakonczona = false;

    const timerWyswietlacz = document.getElementById('licznik-czasu');
    const pasekPrawdy = document.querySelector('.wypelnienie-prawdy');
    const pasekZaufania = document.querySelector('.wypelnienie-zaufania');
    const etykietaPrawdy = document.getElementById('etykieta-prawdy');
    const etykietaZaufania = document.getElementById('etykieta-zaufania');

    const elAwatar = document.getElementById('post-awatar');
    const elAutor = document.getElementById('post-autor');
    const elHandle = document.getElementById('post-handle');
    const elTekst = document.getElementById('post-tekst');
    const elObrazek = document.getElementById('post-obrazek');
    const elZrodloKontener = document.getElementById('post-zrodlo');
    const elTekstZrodla = document.getElementById('tekst-zrodla');

    const przyciskSprawdz = document.querySelector('.przycisk-sprawdz');
    const przyciskOdrzuc = document.querySelector('.przycisk-odrzuc');
    const przyciskUdostepnij = document.querySelector('.przycisk-udostepnij');
    const ekranKoncowy = document.getElementById('ekran-koncowy');
    const przyciskRestart = document.getElementById('przycisk-restart');
    const opisWyniku = document.getElementById('opis-wyniku');
    const zapisWynikuSekcja = document.getElementById('zapis-wyniku-sekcja');
    const graczImieInput = document.getElementById('gracz-imie');
    const zapiszWynikBtn = document.getElementById('zapisz-wynik-btn');
    const rankingLista = document.getElementById('ranking-lista');
    const wyczyscRankingBtn = document.getElementById('wyczysc-ranking-btn');

    const RANKING_KEY = 'wyscig-ranking';
    const ADMIN_PASSWORD = 'ZSTIO';

    function pobierzRankingLokalnie() {
      try {
        const dane = JSON.parse(localStorage.getItem(RANKING_KEY) || '[]');
        return Array.isArray(dane) ? dane : [];
      } catch (error) {
        console.warn('Błąd odczytu rankingu z localStorage:', error);
        return [];
      }
    }

    function zapiszRankingLokalnie(nowyWpis) {
      const ranking = pobierzRankingLokalnie();
      ranking.push(nowyWpis);
      ranking.sort((a, b) => b.punkty - a.punkty);
      const top5 = ranking.slice(0, 5);
      localStorage.setItem(RANKING_KEY, JSON.stringify(top5));
      return top5;
    }

    function kasujRankingJeżeliUprawniony() {
      // Proste sprawdzenie hasła po stronie klienta. Hasło jest widoczne w kodzie —
      // jeśli potrzebujesz bezpieczeństwa, przenieś sprawdzenie na serwer.
      const wpisaneHaslo = prompt('Wpisz hasło administratora, aby usunąć ranking:');
      if (wpisaneHaslo === null) return; // użytkownik anulował

      if (wpisaneHaslo.trim() !== ADMIN_PASSWORD) {
        alert('Błędne hasło. Brak uprawnień do usunięcia rankingu.');
        return;
      }

      localStorage.removeItem(RANKING_KEY);
      pobierzIOdswiezRanking();
      alert('Ranking został wyczyszczony.');
    }

    function wyczyscRanking() {
      // zachowujemy istniejącą nazwę funkcji, ale delegujemy do sprawdzenia hasła
      kasujRankingJeżeliUprawniony();
    }

    function pobierzIOdswiezRanking() {
      if (!rankingLista) return;

      const ranking = pobierzRankingLokalnie();
      rankingLista.innerHTML = '';

      if (!ranking.length) {
        rankingLista.innerHTML = '<li class="ranking-status" style="color: #9ca3af; text-align: center; list-style: none;">Brak wyników. Zapisz się pierwszy!</li>';
        return;
      }

      ranking.forEach((entry) => {
        const li = document.createElement('li');
        li.style.display = 'flex';
        li.style.justifyContent = 'space-between';
        li.style.padding = '6px 8px';
        li.style.borderBottom = '1px solid #1e293b';
        li.style.fontSize = '0.95rem';
        li.innerHTML = `<span style="font-weight: bold; color: #f1f5f9;">${entry.nick}</span><span style="color: #38bdf8; font-weight: bold;">${entry.punkty} pkt</span>`;
        rankingLista.appendChild(li);
      });
    }

    function obliczWynikKoncowy() {
      const iloscPostow = Math.max(1, aktualnyPostIndex + 1);
      const wynikBazowy = (statystykaPrawdy + statystykaZaufania) * iloscPostow;
      const bonusCzasu = Math.max(0, czasNaPost) * 5;
      return Math.round(wynikBazowy + bonusCzasu);
    }

    function uruchomEkranKoncowy(komunikat) {
      if (graZakonczona) return;
      graZakonczona = true;
      clearInterval(timerInterval);
      ostatniWynik = obliczWynikKoncowy();

      if (opisWyniku) {
        opisWyniku.innerText = `${komunikat} Zdobyłeś: ${ostatniWynik} pkt.`;
      }

      if (ekranKoncowy) {
        ekranKoncowy.style.display = 'flex';
      }

      if (zapisWynikuSekcja) {
        zapisWynikuSekcja.style.display = 'flex';
      }

      if (graczImieInput) {
        graczImieInput.value = '';
      }

      pobierzIOdswiezRanking();
    }

    function aktualizujInterfejs() {
      if (pasekPrawdy) pasekPrawdy.style.width = `${statystykaPrawdy}%`;
      if (pasekZaufania) pasekZaufania.style.width = `${statystykaZaufania}%`;
      if (etykietaPrawdy) etykietaPrawdy.innerText = `${statystykaPrawdy}%`;
      if (etykietaZaufania) etykietaZaufania.innerText = `${statystykaZaufania}%`;

      const naglowekOpis = document.querySelector('.naglowek-opis');
      if (naglowekOpis) {
        naglowekOpis.innerText = `Dzień ${aktualnyPostIndex + 1} z 10 | Powstrzymaj Dezinformację`;
      }
    }

    function uruchomTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (graZakonczona) return;

        czasNaPost--;
        if (timerWyswietlacz) timerWyswietlacz.innerText = `Czas: ${czasNaPost}s`;

        if (czasNaPost <= 0) {
          clearInterval(timerInterval);
          uruchomEkranKoncowy('Przegrana! Nie zdążyłeś w czasie.');
        }
      }, 1000);
    }

    function zaladujPost(index) {
      if (graZakonczona) return;

      if (index >= bazaPostów.length) {
        uruchomEkranKoncowy('Gratulacje! Przetrwałeś wszystkie dni i obroniłeś sieć!');
        return;
      }

      const post = bazaPostów[index];
      if (elAwatar) elAwatar.innerText = post.awatar;
      if (elAutor) elAutor.innerText = post.autor;
      if (elHandle) elHandle.innerText = post.handle;
      if (elTekst) elTekst.innerText = post.tekst;
      if (elObrazek) elObrazek.src = post.obrazek;

      if (elZrodloKontener) elZrodloKontener.style.display = 'none';
      if (elTekstZrodla) elTekstZrodla.innerText = post.zrodlo;

      czasNaPost = 30;
      if (timerWyswietlacz) timerWyswietlacz.innerText = 'Czas: 30s';
      aktualizujInterfejs();
      uruchomTimer();
    }

    function nastepnyPost() {
      if (graZakonczona) return;

      if (statystykaPrawdy <= 0 || statystykaZaufania <= 0 || statystykaPrawdy >= 100 || statystykaZaufania >= 100) {
        uruchomEkranKoncowy('Przegrana! Wskaźniki spadły do niebezpiecznego poziomu.');
        return;
      }

      aktualnyPostIndex++;
      zaladujPost(aktualnyPostIndex);
    }

    function rozpatrzOdpowiedz(czyPoprawnie) {
      if (graZakonczona) return;

      if (czyPoprawnie) {
        statystykaPrawdy = Math.min(100, statystykaPrawdy + 5);
        statystykaZaufania = Math.min(100, statystykaZaufania + 4);
      } else {
        statystykaPrawdy = Math.max(0, statystykaPrawdy - 9);
        statystykaZaufania = Math.max(0, statystykaZaufania - 9);
      }

      if (statystykaPrawdy <= 0 || statystykaZaufania <= 0 || statystykaPrawdy >= 100 || statystykaZaufania >= 100) {
        uruchomEkranKoncowy('Przegrana! Wskaźniki spadły do niebezpiecznego poziomu.');
        return;
      }

      nastepnyPost();
    }

    if (przyciskSprawdz) {
      przyciskSprawdz.addEventListener('click', () => {
        if (graZakonczona) return;

        if (timerWyswietlacz) {
          czasNaPost = Math.max(0, czasNaPost - 5);
          timerWyswietlacz.innerText = `Czas: ${czasNaPost}s`;
        }

        statystykaZaufania = Math.min(100, statystykaZaufania + 5);
        aktualizujInterfejs();

        if (czasNaPost <= 0) {
          uruchomEkranKoncowy('Przegrana! Nie zdążyłeś w czasie po sprawdzeniu źródła.');
          return;
        }
      });
    }

    if (przyciskOdrzuc) {
      przyciskOdrzuc.addEventListener('click', () => {
        const post = bazaPostów[aktualnyPostIndex];
        if (!post) return;
        rozpatrzOdpowiedz(post.czyPrawda === false);
      });
    }

    if (przyciskUdostepnij) {
      przyciskUdostepnij.addEventListener('click', () => {
        const post = bazaPostów[aktualnyPostIndex];
        if (!post) return;
        rozpatrzOdpowiedz(post.czyPrawda === true);
      });
    }

    if (zapiszWynikBtn) {
      zapiszWynikBtn.addEventListener('click', () => {
        const nick = (graczImieInput && graczImieInput.value || '').trim();
        if (!nick) {
          alert('Wpisz nick, aby zapisać wynik!');
          return;
        }

        const wpis = { nick, punkty: ostatniWynik };
        const ranking = zapiszRankingLokalnie(wpis);
        rankingLista.innerHTML = '';

        ranking.forEach((entry) => {
          const li = document.createElement('li');
          li.style.display = 'flex';
          li.style.justifyContent = 'space-between';
          li.style.padding = '6px 8px';
          li.style.borderBottom = '1px solid #1e293b';
          li.style.fontSize = '0.95rem';
          li.innerHTML = `<span style="font-weight: bold; color: #f1f5f9;">${entry.nick}</span><span style="color: #38bdf8; font-weight: bold;">${entry.punkty} pkt</span>`;
          rankingLista.appendChild(li);
        });

        if (zapisWynikuSekcja) {
          zapisWynikuSekcja.style.display = 'none';
        }
      });
    }

    if (wyczyscRankingBtn) {
      wyczyscRankingBtn.addEventListener('click', () => {
        const potwierdz = prompt('Na pewno usunąć cały ranking?');
        if (potwierdz == ZSTiO) {
          kasujRankingJeżeliUprawniony();
        }
      });
    }

    if (przyciskRestart) {
      przyciskRestart.addEventListener('click', () => {
        aktualnyPostIndex = 0;
        statystykaPrawdy = 50;
        statystykaZaufania = 50;
        ostatniWynik = 0;
        graZakonczona = false;
        if (ekranKoncowy) ekranKoncowy.style.display = 'none';
        zaladujPost(aktualnyPostIndex);
      });
    }

    pobierzIOdswiezRanking();
    zaladujPost(aktualnyPostIndex);
  </script>
</body>
</html>
